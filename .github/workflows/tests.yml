name: Tests

# ---------------------------------------------------------------------------
# Fast test + lint pipeline for RelicToEpub.
#
# Trigger: every push and PR (master + feature branches).
#
# What it does:
#   1. Install dev dependencies (CPU torch so the job is self-contained;
#      GPU/mark=slow tests are skipped).
#   2. Run `ruff check` against `src/` and `tests/`.
#   3. Run `pytest -q` (existing tests use a FakeOCRRunner so no model
#      download is required and the job finishes in under 2 minutes).
#
# The Windows installer workflow (build-windows.yml) handles packaging on
# push to master and is independent of this one.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: lint + pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev dependencies (CPU torch)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Use the "cpu" extra so we don't pull a 1.5 GB CUDA wheel on CI.
          # The "pkg" extra is for the Windows installer workflow only.
          python -m pip install -e ".[dev,cpu]"

      - name: Ensure pandoc is installed on the runner
        shell: bash
        run: |
          set -euo pipefail
          # The compile pipeline uses `pypandoc` with `--syntax-highlighting`,
          # which is only available in pandoc >= 2.16. The `pandoc` package in
          # Ubuntu 22.04 (default ubuntu-latest image) is older, so install
          # the latest official release from GitHub instead. Windows runners
          # ship with a recent pandoc (choco provides current), so we just
          # ensure it is present there.
          if [ "$RUNNER_OS" = "Windows" ]; then
            if ! command -v pandoc >/dev/null 2>&1; then
              choco install pandoc -y --no-progress
            fi
          else
            PANDOC_VERSION="3.1.13"
            if ! command -v pandoc >/dev/null 2>&1 || \
               [ "$(pandoc --version | head -n1 | awk '{print $2}')" != "$PANDOC_VERSION" ]; then
              echo "Installing pandoc $PANDOC_VERSION from GitHub releases"
              curl -fsSL -o /tmp/pandoc.deb \
                "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
              sudo apt-get install -y /tmp/pandoc.deb
              rm -f /tmp/pandoc.deb
            fi
            # Force the freshly-installed binary into a path that wins over
            # any system-bundled pandoc. Some shell environments on the
            # ubuntu runner do not include /usr/bin (where dpkg installs the
            # binary) in their PATH search order, so pypandoc ended up
            # calling an older pandoc. /usr/local/bin is always searched.
            sudo ln -sf /usr/bin/pandoc /usr/local/bin/pandoc
            hash -r
          fi
          echo "pandoc path: $(command -v pandoc)"
          pandoc --version | head -n1

      - name: Ruff lint
        shell: pwsh
        run: |
          ruff check src tests

      - name: Pytest
        shell: pwsh
        run: |
          # Diagnostic: make sure pytest sees the same pandoc we just installed.
          if ($env:RUNNER_OS -ne 'Windows') {
            # Ensure pypandoc uses the /usr/local binary we installed from the deb.
            # pypandoc 1.17 respects PYPANDOC_PANDOC_PATH.
            $env:PYPANDOC_PANDOC_PATH = '/usr/local/bin/pandoc'
          }
          Get-Command pandoc -ErrorAction SilentlyContinue | Format-List
          pandoc --version | Select-Object -First 1
          # -q for compact output; existing tests are model-free thanks to
          # the FakeOCRRunner monkeypatch in tests/test_pipeline.py.
          pytest -q
