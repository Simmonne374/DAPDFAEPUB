name: Build Windows installer

# ---------------------------------------------------------------------------
# Pipeline CI per RelicToEpub.
#
# Trigger:  ogni push a master (anche dopo merge di PR).
#           Avviabile anche manualmente da Actions -> Run workflow.
#
# Risultato:
#   1) workflow artifact: installer .exe scaricabile dalla run page
#   2) GitHub Release: tag vX.Y.Z (semver) con installer allegato
#      e changelog Markdown generato da build/scripts/render_changelog.py
#
# Il bump di versione (pyproject.toml) NON avviene qui: viene gestito
# dal workflow separato release-bump.yml su release: published.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [master]
  workflow_dispatch:

# Evita run concorrenti.
concurrency:
  group: build-windows-master
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  build-windows-installer:
    name: Build RelicToEpub-Setup.exe on Windows
    runs-on: windows-latest
    timeout-minutes: 240

    env:
      PYTHON_VERSION: '3.11'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Show Python and pip versions
        id: python-info
        shell: pwsh
        run: |
          python --version
          python -m pip --version
          # The runner also has Python 3.13 preinstalled in PATH, so we must
          # pin PYTHON_BIN to the exact interpreter where we just installed
          # PyInstaller (otherwise build_windows.ps1 auto-detects 3.13 first
          # and fails with "No module named PyInstaller").
          $pyExe = (python -c "import sys; print(sys.executable)").Trim()
          Write-Host "Pinned PYTHON_BIN=$pyExe"
          "PYTHON_BIN=$pyExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install build and runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[pkg]"

      - name: Install Inno Setup 6 (ISCC)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "C:\InnoSetup6"
          if (Test-Path "$dest\ISCC.exe") {
            Write-Host "ISCC already present in $dest - skipping download"
          } else {
            # Direct GitHub Releases URL of the official jrsoftware/issrc
            # repository: this is the actual .exe binary (no HTML landing page,
            # no PHP redirect that Invoke-WebRequest fails to follow).
            $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
            $installer = "$env:TEMP\innosetup-installer.exe"
            Write-Host "Downloading Inno Setup 6.7.3 from $url ..."
            Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
            $size = (Get-Item $installer).Length
            Write-Host "Downloaded: $size bytes"
            if ($size -lt 1MB) {
              throw "Inno Setup installer looks too small ($size bytes) — download probably failed."
            }
            # Pre-build the argument list (avoids Start-Process parser quirks
            # with "+ $dest" after a backtick line-continuation).
            $dirArg = "/DIR=$dest"
            $args = @("/SP-","/VERYSILENT","/SUPPRESSMSGBOXES","/CURRENTUSER","/NORESTART",$dirArg)
            $proc = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
            if ($proc.ExitCode -ne 0) {
              throw "Inno Setup install failed (exit $($proc.ExitCode))"
            }
          }
          Write-Host "ISCC ready at $dest\ISCC.exe"
          "ISCC=$dest\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

      # --------------------------------------------------------------
      # Calcola la prossima versione semver in base ai commit dal
      # tag semver precedente (se esiste). bump_version.py produce
      # patch/minor/major secondo i Conventional Commits.
      # --------------------------------------------------------------
      - name: Compute next version
        id: next-version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $v = python build/scripts/bump_version.py
          if ($LASTEXITCODE -ne 0) { throw "bump_version.py failed (exit $LASTEXITCODE)" }
          $v = $v.Trim()
          Write-Host "Next version: $v"
          "MYAPP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          "MYAPP_VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer (PyInstaller + Inno Setup)
        id: build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:ISCC = "C:\InnoSetup6\ISCC.exe"
          & .\build\build_windows.ps1
          if ($LASTEXITCODE -ne 0) { throw "build_windows.ps1 exit $LASTEXITCODE" }

      - name: Locate installer artifact
        id: locate
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path .\Output -Filter "RelicToEpub-Setup-*.exe" -File | Select-Object -First 1
          if (-not $installer) { throw "Installer not found in .\Output" }
          Write-Host "Installer: $($installer.FullName) ($([math]::Round($installer.Length/1MB,1)) MB)"
          "INSTALLER_PATH=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_NAME=$($installer.Name)"     | Out-File -FilePath $env:GITHUB_ENV -Append
          "INSTALLER_SIZE=$($installer.Length)"   | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RelicToEpub-Setup
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RelicToEpub-build-logs
          path: |
            build_boot.log
            build_app.log
          if-no-files-found: ignore
          retention-days: 7

      # --------------------------------------------------------------
      # Genera il changelog Markdown dal tag semver precedente (se
      # esiste) al commit corrente. Viene usato come body della
      # GitHub Release vX.Y.Z.
      # --------------------------------------------------------------
      - name: Generate changelog Markdown
        id: changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $prevTag = (git tag --list "v*" | Sort-Object -Descending | Select-Object -First 1)
          $ref = "${{ github.sha }}"
          if (-not $prevTag) {
            Write-Host "No previous semver tag - generating changelog from initial commit"
            $prevRef = (git rev-list --max-parents=0 HEAD).Trim()
          } else {
            Write-Host "Previous semver tag: $prevTag"
            $prevRef = $prevTag
          }
          $md = python build/scripts/render_changelog.py $prevRef $ref
          if ($LASTEXITCODE -ne 0) { throw "render_changelog.py failed (exit $LASTEXITCODE)" }
          [System.IO.File]::WriteAllText("changelog.md", $md, [System.Text.Encoding]::UTF8)
          Write-Host "Changelog written to changelog.md ($((Get-Item changelog.md).Length) bytes)"

      # --------------------------------------------------------------
      # Crea (o aggiorna) una release GitHub con tag vX.Y.Z
      # (versione calcolata sopra). Allega l'installer e usa il
      # changelog generato come body. NON marca la release come draft
      # in modo che release-bump.yml possa reagire a published.
      # --------------------------------------------------------------
      - name: Create or update GitHub release v${{ env.MYAPP_VERSION }}
        if: startsWith(github.ref, 'refs/heads/master')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag   = "v${{ env.MYAPP_VERSION }}"
          $title = "RelicToEpub ${{ env.MYAPP_VERSION }}"
          $sizeMB = [math]::Round($env:INSTALLER_SIZE / 1MB, 1)
          $notes = Get-Content -Raw -Encoding utf8 changelog.md
          $header = @"
          ## RelicToEpub `${{ env.MYAPP_VERSION }}

          - Commit: `${{ github.sha }}
          - Branch: `${{ github.ref_name }}
          - Built:  `${{ github.event.head_commit.timestamp }}
          - Installer: `${{ env.INSTALLER_NAME }}  ($sizeMB MB)

          ---
          "@
          $body = $header + "`n" + $notes
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists - updating asset and notes"
            gh release upload $tag $env:INSTALLER_PATH --clobber | Out-Null
            $tmp = [System.IO.Path]::GetTempFileName()
            [System.IO.File]::WriteAllText($tmp, $body, [System.Text.Encoding]::UTF8)
            gh release edit  $tag --title $title --notes-file $tmp | Out-Null
            Remove-Item $tmp
          } else {
            Write-Host "Creating release $tag"
            $tmp = [System.IO.Path]::GetTempFileName()
            [System.IO.File]::WriteAllText($tmp, $body, [System.Text.Encoding]::UTF8)
            $ghArgs = @(
              $tag,
              $env:INSTALLER_PATH,
              "--title", $title,
              "--notes-file", $tmp,
              "--target", "${{ github.sha }}"
            )
            gh release create @ghArgs | Out-Null
            Remove-Item $tmp
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release v${{ env.MYAPP_VERSION }} failed" }

      - name: Upload changelog artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RelicToEpub-changelog
          path: changelog.md
          if-no-files-found: ignore
          retention-days: 30